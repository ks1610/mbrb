{% extends "base.html" %}

{% block title %}Chat - Hanah IoT{% endblock %}
{% block body_class %}chat-body{% endblock %}

{% block content %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prompt Establish - Hanah</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="chat-body">
  <div class="chat-container" id="chatBox">
    <div class="message bot welcome-message" data-time="Vừa xong">
      <div class="bubble">
        <strong>Chào anh!</strong> 👋<br><br>
        Tôi là Hanah - trợ lý ảo hệ thống IoT
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="Nhập tin nhắn của bạn..." autocomplete="off">
    <button onclick="sendMessage()" id="sendButton">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
      Gửi
    </button>
  </div>

  <script>
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const sendButton = document.getElementById('sendButton');

    // Focus input on load
    window.addEventListener('load', () => {
      input.focus();
      scrollToBottom();
    });

    input.addEventListener("keypress", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.setAttribute('data-time', 'Đang nhập...');
      typingDiv.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      return typingDiv;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Disable send button and input during request
      sendButton.disabled = true;
      input.disabled = true;

      // 1. Hiện tin nhắn người dùng
      addMessage(text, 'user');
      input.value = '';
      input.style.height = 'auto';

      // 2. Hiện typing indicator
      const typingIndicator = createTypingIndicator();
      chatBox.appendChild(typingIndicator);
      scrollToBottom();

      try {
        // 3. Gửi lên Server
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        
        if (!res.ok) throw new Error('Network response was not ok');
        
        const data = await res.json();
        
        // 4. Xóa typing indicator và hiện câu trả lời
        typingIndicator.remove();
        
        // Format response if it contains device control commands
        let reply = data.reply;
        if (text.toLowerCase().includes('bật') || text.toLowerCase().includes('tắt')) {
          reply = `✅ ${reply}\n\n<i>Thiết bị đã được cập nhật trên dashboard.</i>`;
        }
        
        addMessage(reply, 'bot');
        
      } catch (e) {
        console.error('Error:', e);
        typingIndicator.remove();
        addMessage("❌ Lỗi kết nối. Vui lòng thử lại sau hoặc kiểm tra kết nối mạng.", 'bot');
        
        // Show error notification
        showNotification('Lỗi kết nối', 'Không thể kết nối đến máy chủ. Vui lòng thử lại.');
      } finally {
        // Re-enable input and button
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.setAttribute('data-time', getCurrentTime());
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = text;
      
      div.appendChild(bubble);
      chatBox.appendChild(div);
      scrollToBottom();
      
      // Add animation
      setTimeout(() => {
        div.style.animation = 'messageAppear 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        div.style.opacity = '1';
        div.style.transform = 'translateY(0)';
      }, 10);
    }

    function showNotification(title, message) {
      // Create notification element
      const notification = document.createElement('div');
      notification.className = 'notification';
      notification.innerHTML = `
        <div class="notification-icon">!</div>
        <div class="notification-content">
          <div class="notification-title">${title}</div>
          <div class="notification-message">${message}</div>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      // Show notification
      setTimeout(() => {
        notification.classList.add('show');
      }, 10);
      
      // Auto remove after 5 seconds
      setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => {
          if (notification.parentNode) {
            notification.parentNode.removeChild(notification);
          }
        }, 300);
      }, 5000);
    }

    // Example of auto-suggestions (optional feature)
    const suggestions = [
      "Bật thiết bị 1",
      "Tắt tất cả thiết bị",
      "Trạng thái thiết bị",
      "Giúp đỡ"
    ];

    // Add this if you want to show suggestions
    function showSuggestions() {
      const suggestionBox = document.createElement('div');
      suggestionBox.className = 'suggestions';
      suggestionBox.innerHTML = `
        <div class="suggestion">Bật thiết bị 1</div>
        <div class="suggestion">Tắt tất cả thiết bị</div>
      `;
      // You can implement this based on your needs
    }
    // Gọi hàm này khi trang web tải xong (DOMContentLoaded)
    document.addEventListener("DOMContentLoaded", function() {
        loadChatHistory();
    });

    function loadChatHistory() {
      fetch('/api/chat/history')
        .then(response => response.json())
        .then(data => {
            if (data.history && data.history.length > 0) {
                data.history.forEach(chat => {
                    let timeStr = null;
                    if (chat.timestamp) {
                        try {
                            timeStr = chat.timestamp.split(' ')[1].substring(0, 5);
                        } catch(e) {}
                    }
                    addMessage(chat.content, chat.role, timeStr);
                });
                // Đợi render xong rồi cuộn xuống cuối
                setTimeout(scrollToBottom, 100); 
            }
        })
        .catch(error => console.error("Lỗi khi tải lịch sử chat:", error));
    }
  </script>
</body>
</html>
{% endblock %}
