{% extends "base.html" %}

{% block title %}Chat - Hanah IoT{% endblock %}
{% block body_class %}chat-body{% endblock %}

{% block content %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prompt Establish - Hanah</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="chat-body">
  <div class="chat-container" id="chatBox">
    <div class="message bot welcome-message" data-time="Vừa xong">
      <div class="bubble">
        <strong>Xin Chào!</strong> 👋<br><br>
        Tôi là Hanah - trợ lý ảo hệ thống IoT
      </div>
    </div>
  </div>
  <div class="chat-input-area" id = "chatInputArea">
    <div class = "input-wrapper"> 
      <div class="input-container"> 
        <input type="text" id="userInput" placeholder="Nhập tin nhắn của bạn..." autocomplete="off">
        <div class="dropdown-container">
          <button class="dropdown-trigger" id="dropdownTrigger" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <div class="dropdown-menu" id="dropdownMenu">
            <div class="dropdown-item" onclick="showRequestBox('Create Routine')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              Create Routine
            </div>
            <div class="dropdown-item" onclick="showRequestBox('Bug Submit')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              Bug Submit
            </div>
            <div class="dropdown-item" onclick="showRequestBox('Feature Request')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              Feature Request
            </div>
          </div>
        </div>
      </div>
      <div class="routine-box" id="routineBox">
        <span id="routineTitle">Create Routine</span>
        <button class="close-routine" onclick="hideRoutineBox()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
    </div>
    <button onclick="sendMessage()" id="sendButton">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
      Gửi
    </button>
  </div>

  <script>
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const sendButton = document.getElementById('sendButton');
    
    function showRequestBox(type) {
        currentRequestType = type;
        const routineBox = document.getElementById('routineBox');
        const routineTitle = document.getElementById('routineTitle');

        routineTitle.innerText = type; // Cập nhật tiêu đề hiển thị
        dropdownMenu.classList.remove('show');
        routineBox.classList.add('show');
    }
    // Focus input on load
    window.addEventListener('load', () => {
      input.focus();
      scrollToBottom();
    });

    input.addEventListener("keypress", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.setAttribute('data-time', 'Đang nhập...');
      typingDiv.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      return typingDiv;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Disable send button and input during request
      sendButton.disabled = true;
      input.disabled = true;

      // 1. Hiện tin nhắn người dùng
      addMessage(text, 'user');
      input.value = '';
      input.style.height = 'auto';

      const routineBox = document.getElementById('routineBox');
      let endpoint = '/api/chat';
      let payload = { message: text };

      // KIỂM TRA NẾU LÀ BUG HOẶC FEATURE
      if (routineBox.classList.contains('show')) {
          if (currentRequestType === 'Bug Submit' || currentRequestType === 'Feature Request') {
              endpoint = '/api/submit-report'; // Sử dụng endpoint mới
              payload = {
                  type: currentRequestType,
                  content: text
              };
          } else {
              // Logic cho Routine
              payload.message = "ROUTINE_CREATE: " + text;
          }
          hideRoutineBox();
      }

      // 2. Hiện typing indicator
      const typingIndicator = createTypingIndicator();
      chatBox.appendChild(typingIndicator);
      scrollToBottom();

      try {
        // 3. Gửi lên Server
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload) // Thay thế finalMessage bằng biến payload
        });
        
        if (!res.ok) throw new Error('Network response was not ok');
        
        const data = await res.json();
        
        // 4. Xóa typing indicator và hiện câu trả lời
        typingIndicator.remove();
        
        let reply = data.reply;
        
        // Kiểm tra xem đây có phải lệnh tạo Routine không
        const isRoutineCmd = payload.message && payload.message.startsWith("ROUTINE_CREATE:");
        
        // Format response nếu là lệnh bật/tắt thiết bị thông thường
        if (!isRoutineCmd && endpoint === '/api/chat') {
          if (text.toLowerCase().includes('bật') || text.toLowerCase().includes('tắt')) {
            reply = `✅ ${reply}\n\n<i>Thiết bị đã được cập nhật trên dashboard.</i>`;
          }
        }
        
        addMessage(reply, 'bot');
        
      } catch (e) {
        console.error('Error:', e);
        typingIndicator.remove();
        addMessage("❌ Lỗi kết nối. Vui lòng thử lại sau hoặc kiểm tra kết nối mạng.", 'bot');
        showNotification('Lỗi kết nối', 'Không thể kết nối đến máy chủ. Vui lòng thử lại.');
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.setAttribute('data-time', getCurrentTime());
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = text;
      
      div.appendChild(bubble);
      chatBox.appendChild(div);
      scrollToBottom();
      
      // Add animation
      setTimeout(() => {
        div.style.animation = 'messageAppear 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        div.style.opacity = '1';
        div.style.transform = 'translateY(0)';
      }, 10);
    }

    function showNotification(title, message) {
      // Create notification element
      const notification = document.createElement('div');
      notification.className = 'notification';
      notification.innerHTML = `
        <div class="notification-icon">!</div>
        <div class="notification-content">
          <div class="notification-title">${title}</div>
          <div class="notification-message">${message}</div>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      // Show notification
      setTimeout(() => {
        notification.classList.add('show');
      }, 10);
      
      // Auto remove after 5 seconds
      setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => {
          if (notification.parentNode) {
            notification.parentNode.removeChild(notification);
          }
        }, 300);
      }, 5000);
    }

    // Example of auto-suggestions (optional feature)
    const suggestions = [
      "Bật thiết bị 1",
      "Tắt tất cả thiết bị",
      "Trạng thái thiết bị",
      "Giúp đỡ"
    ];

    // Add this if you want to show suggestions
    function showSuggestions() {
      const suggestionBox = document.createElement('div');
      suggestionBox.className = 'suggestions';
      suggestionBox.innerHTML = `
        <div class="suggestion">Bật thiết bị 1</div>
        <div class="suggestion">Tắt tất cả thiết bị</div>
      `;
      // You can implement this based on your needs
    }
    // Gọi hàm này khi trang web tải xong (DOMContentLoaded)
    document.addEventListener("DOMContentLoaded", function() {
        loadChatHistory();
    });

    function loadChatHistory() {
      fetch('/api/chat/history')
        .then(response => response.json())
        .then(data => {
            if (data.history && data.history.length > 0) {
                data.history.forEach(chat => {
                    let timeStr = null;
                    if (chat.timestamp) {
                        try {
                            timeStr = chat.timestamp.split(' ')[1].substring(0, 5);
                        } catch(e) {}
                    }
                    addMessage(chat.content, chat.role, timeStr);
                });
                // Đợi render xong rồi cuộn xuống cuối
                setTimeout(scrollToBottom, 100); 
            }
        })
        .catch(error => console.error("Lỗi khi tải lịch sử chat:", error));
    }
    // Dropdown toggle
    const dropdownTrigger = document.getElementById('dropdownTrigger');
    const dropdownMenu = document.getElementById('dropdownMenu');
      
    if (dropdownTrigger) {
      dropdownTrigger.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
      });
    
      // Close dropdown when clicking outside
      document.addEventListener('click', function(e) {
        if (!dropdownTrigger.contains(e.target) && !dropdownMenu.contains(e.target)) {
          dropdownMenu.classList.remove('show');
        }
      });
    }
    
    function showRoutineBox() {
      const routineBox = document.getElementById('routineBox');
      const userInput = document.getElementById('userInput');
      
      // Hide dropdown
      dropdownMenu.classList.remove('show');
      // userInput.style.display = 'none';
      routineBox.classList.add('show');
    }
    
    function hideRoutineBox() {
      const routineBox = document.getElementById('routineBox');
      const userInput = document.getElementById('userInput');
      
      // Hide routine box and show regular input
      routineBox.classList.remove('show');
      userInput.style.display = 'block';
      userInput.focus();
    }
    
    // Optional: Handle routine creation
    document.addEventListener('DOMContentLoaded', function() {
      const routineBox = document.getElementById('routineBox');
      if (routineBox) {
        routineBox.addEventListener('click', function(e) {
          // Prevent click from closing when clicking on the box itself (except the close button)
          e.stopPropagation();
        });
      }
    });
  </script>
</body>
</html>
{% endblock %}
